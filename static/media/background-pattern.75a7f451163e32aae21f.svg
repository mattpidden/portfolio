		<path d="M438 900h24v14h-24zM450 900l-6-8h12z"/>
		<path d="M578 900h24v14h-24zM590 900l-6-8h12z"/>
		<path d="M430 880h40M570 880h40"/>
		<path d="M450 892l70-122M590 892l-70-122"/>
		<path d="M450 880L450 780M590 880L590 780" stroke-dasharray="4 5"/>
		<circle cx="520" cy="770" r="4"/>
		<circle cx="460.8" cy="880" r="2"/>
		<circle cx="579.2" cy="880" r="2"/>
		<path d="M450 930h140M450 924v12M590 924v12M454 930l8-4M454 930l8 4M586 930l-8-4M586 930l-8 4"/>
	</g>

	<g fill="#21201f" opacity="0.05" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
