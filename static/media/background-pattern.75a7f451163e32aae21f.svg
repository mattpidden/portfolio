		<text x="540" y="40" font-size="20">Δt</text>
		<text x="400" y="365" font-size="24">∑</text>
		<text x="640" y="250" font-size="16">⌀12</text>
		<text x="280" y="540" font-size="14">±0.05</text>
		<text x="510" y="660" font-size="18">;</text>
		<text x="150" y="250" font-size="16">π/2</text>
		<text x="300" y="100" font-size="14">x, y, z</text>
		<text x="336" y="236" font-size="12">z</text>
		<text x="396" y="304" font-size="12">y</text>
		<text x="280" y="342" font-size="12">x</text>
		<text x="600" y="460" font-size="14">10 kn</text>
		<text x="440" y="130" font-size="12">10kΩ</text>
		<text x="40" y="160" font-size="20">#</text>
		<text x="148" y="736" font-size="14">L</text>
		<text x="214" y="816" font-size="14">D</text>
		<text x="40" y="824" font-size="12">V∞</text>
		<text x="132" y="866" font-size="12">α</text>
		<text x="40" y="935" font-size="13">L = ½ρv²SC_L</text>
		<text x="527" y="764" font-size="14">P</text>
		<text x="516" y="950" font-size="13">B</text>
		<text x="474" y="876" font-size="11">f</text>
		<text x="612" y="800" font-size="13">Z = fB / d</text>
		<text x="420" y="912" font-size="12">L</text>
		<text x="608" y="912" font-size="12">R</text>
	</g>
