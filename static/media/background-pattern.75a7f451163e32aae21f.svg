		<!-- resistor zig-zag -->
		<path d="M420 160h20l6-10 12 20 12-20 12 20 12-20 6 10h20"/>

		<!-- hexagon / bolt head -->
		<path d="M60 240l18-10 18 10v20l-18 10-18-10z"/>
		<circle cx="78" cy="250" r="6"/>

		<!-- wing sail / boat silhouette -->
