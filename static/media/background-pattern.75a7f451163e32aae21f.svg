		<!-- circuit trace -->
		<path d="M300 40h50l20 20h60"/>
		<circle cx="300" cy="40" r="4"/>
		<circle cx="434" cy="60" r="4"/>

		<!-- aerodynamic lift on a sail section: flow, lift and drag vectors -->
