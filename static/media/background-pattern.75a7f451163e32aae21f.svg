<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960" viewBox="0 0 720 960">
	<!-- Faint engineering / robotics / code doodles, tiled behind the page -->
	<g fill="none" stroke="#21201f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.05">
