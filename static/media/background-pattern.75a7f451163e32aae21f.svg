		<path d="M40 70v24M200 70v24M44 82h152M44 82l10-5M44 82l10 5M196 82l-10-5M196 82l-10 5"/>

		<!-- gear -->
		<g transform="translate(560 110)">
			<circle r="26"/>
			<circle r="9"/>
